[project]
name = "fairino-controller"
version = "0.1.0"
description = "A simulated Fairino FR5 with a live 3D view: click the floor and it works out the joint angles to go there."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "arkitekt[rekuest]>=18.5.2",
    "numpy>=2.5.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
addopts = "-m 'not hub'"

[tool.ruff.lint]
extend-select = ["UP"]
extend-ignore = ["UP037", "UP038", "UP042", "UP040", "UP046", "UP047", "UP049"]

[tool.semantic_release]
version_variables = ["app.py:__version__"]
commit_message = "chore(release): {version} [skip ci]"
tag_format = "v{version}"
allow_zero_version = true

[tool.semantic_release.branches.release]
match = "main"
prerelease = false
